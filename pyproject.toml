[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emelya"
version = "0.5.3"
description = "CLI AI agent for local and cloud LLMs with tool calling, MCP support, and zero dependencies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Alexey Shtokalo"}]
keywords = ["ai", "agent", "cli", "llm", "llama.cpp", "tool-calling", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.scripts]
emelya = "emelya.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emelya = ["tools/*.md", "tools/man/*.md"]

[tool.setuptools.data-files]
"share/emelya/prompts" = ["prompts/*.md"]
"share/emelya/skills" = ["skills/*.md"]
"share/emelya/agents" = ["agents/*.md"]
